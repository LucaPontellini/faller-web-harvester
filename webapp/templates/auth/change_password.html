{% extends "base.html" %}
{% block title %}Cambia Password - Faller Harvester{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm border-0 rounded-3">
            
            <!-- Header della card -->
            <div class="card-header bg-dark text-white text-center py-3">
                <h4 class="mb-0 fw-bold">Cambia Password</h4>
            </div>

            <!-- Corpo del form -->
            <div class="card-body p-4">
                <!-- Form per aggiornare la password -->
                <form method="POST" id="changePasswordForm">
                    
                    <!-- Password attuale -->
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-bold">PASSWORD ATTUALE</label>
                        <div class="input-group">
                            <!-- Icona -->
                            <span class="input-group-text bg-light border-end-0">
                                <i class="bi bi-key"></i>
                            </span>
                            <!-- Campo input -->
                            <input type="password" name="old_password" id="old_password" class="form-control border-start-0 bg-light" required>
                        </div>
                    </div>
                    
                    <!-- Nuova password -->
                    <div class="mb-4">
                        <label class="form-label text-muted small fw-bold">NUOVA PASSWORD</label>
                        <div class="input-group">
                            <!-- Icona -->
                            <span class="input-group-text bg-light border-end-0">
                                <i class="bi bi-shield-lock"></i>
                            </span>
                            <!-- Campo input -->
                            <input type="password" name="new_password" id="new_password" class="form-control border-start-0 bg-light" required>
                        </div>
                    </div>

                    <!-- Messaggio di errore -->
                    <div id="passwordError" class="alert alert-danger py-2 small d-none">
                        La nuova password deve essere diversa da quella attuale e lunga almeno 6 caratteri.
                    </div>

                    <!-- Bottone di invio -->
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg shadow-sm">
                            Aggiorna Password
                        </button>
                    </div>
                </form>
            </div>

            <!-- Footer della card -->
            <div class="card-footer bg-transparent text-center py-3">
                <!-- Link per tornare alla dashboard -->
                <a href="{{ url_for('main.dashboard') }}" class="text-decoration-none text-muted small">
                    Annulla e torna indietro
                </a>
            </div>

        </div>
    </div>
</div>
<!-- Script esterno per la logica del cambio password -->
<script src="{{ url_for('static', filename='js/change_password.js') }}"></script>
{% endblock %}
