{% extends "base.html" %}
{% block title %}Registrazione - Faller Harvester{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">

        <!-- Card principale del form di registrazione -->
        <div class="card shadow">

            <!-- Header della card -->
            <div class="card-header bg-primary text-white text-center">
                <h4 class="mb-0">Crea un Account</h4>
            </div>

            <!-- Corpo del form -->
            <div class="card-body">
                <form method="POST" id="registerForm">

                    <!-- Campo username -->
                    <div class="mb-3">
                        <label for="username" class="form-label">Nome Utente</label>
                        <input type="text" name="username" id="username" class="form-control" placeholder="Inserisci username" required>
                    </div>
                    
                    <!-- Campo password -->
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" name="password" id="password" class="form-control" placeholder="Inserisci password" required>
                    </div>
                    
                    <!-- Campo conferma password -->
                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">Conferma Password</label>
                        <input type="password" name="confirm_password" id="confirm_password" class="form-control" placeholder="Ripeti password" required>
                    </div>

                    <!-- Messaggio di errore (inizialmente nascosto) -->
                    <div id="passwordError" class="alert alert-danger py-2 small d-none">
                        Le password non coincidono.
                    </div>
                    
                    <!-- Bottone di invio -->
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Registrati</button>
                    </div>

                </form>
            </div>

            <!-- Footer con link al login -->
            <div class="card-footer text-center">
                <small class="text-muted">
                    Hai già un account? <a href="{{ url_for('auth.login') }}">Accedi qui</a>
                </small>
            </div>

        </div>
    </div>
</div>
<!-- Script esterno per la logica della registrazione -->
<script src="{{ url_for('static', filename='js/register.js') }}"></script>
{% endblock %}
