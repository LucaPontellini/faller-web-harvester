{% extends "base.html" %}
{% block title %}Errore Interno - Faller Harvester{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <!-- Icona errore -->
            <i class="bi bi-exclamation-triangle text-danger" style="font-size: 5rem;"></i>

            <!-- Titoli -->
            <h1 class="display-4 fw-bold mt-3">Errore 500</h1>
            <h2 class="text-muted">Ops! Qualcosa è andato storto.</h2>

            <!-- Descrizione -->
            <p class="lead mt-4">
                Il server ha riscontrato un problema imprevisto. 
                Stiamo già lavorando per capire cosa non ha funzionato.
            </p>

            <!-- Pulsante per tornare alla home -->
            <div class="mt-5">
                <a href="{{ url_for('main.index') }}" class="btn btn-primary btn-lg shadow-sm">
                    <i class="bi bi-house-door"></i> Torna alla Home
                </a>
            </div>

        </div>
    </div>
</div>
{% endblock %}
