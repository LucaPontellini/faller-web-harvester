{% extends "base.html" %}
{% block title %}Pagina non trovata - Faller Harvester{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <!-- Icona errore 404 -->
            <i class="bi bi-search text-warning" style="font-size: 5rem;"></i>

            <!-- Titoli -->
            <h1 class="display-4 fw-bold mt-3">Errore 404</h1>
            <h2 class="text-muted">Pagina non trovata</h2>

            <!-- Descrizione -->
            <p class="lead mt-4">
                L'indirizzo che stai cercando non esiste oppure è stato spostato.
            </p>

            <!-- Pulsante per tornare alla home -->
            <div class="mt-5">
                <a href="{{ url_for('main.index') }}" class="btn btn-primary btn-lg shadow-sm">
                    <i class="bi bi-house-door"></i> Torna alla Home
                </a>
            </div>

        </div>
    </div>
</div>
{% endblock %}
